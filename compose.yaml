name: noc-flow-cloud-v2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nocflow}
      POSTGRES_USER: ${POSTGRES_USER:-nocflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nocflow}
    ports:
      - "5432:5432"
    volumes:
      - nocflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nocflow} -d ${POSTGRES_DB:-nocflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      NOCFLOW_ENVIRONMENT: development
      NOCFLOW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nocflow}:${POSTGRES_PASSWORD:-nocflow}@postgres:5432/${POSTGRES_DB:-nocflow}
      NOCFLOW_CORS_ORIGINS: '["http://localhost:4200"]'
      NOCFLOW_LOG_LEVEL: INFO
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: ./apps/web
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  nocflow_postgres_data:
