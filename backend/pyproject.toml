[project]
name = "noc-flow-api"
version = "0.1.0a0"
description = "FastAPI backend for P0 — NOC Flow Cloud v2"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2.0",
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.40,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
