name: Cloudflare Private Full-Stack

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/cloudflare-private-ui.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/cloudflare-private-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "apps/web/.node-version"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Type check Angular
        run: npm run lint

      - name: Angular unit tests
        run: npm test

      - name: Worker contract tests
        run: npm run test:worker

      - name: Production build
        run: npm run build

      - name: Validate static asset output
        run: test -f dist/noc-flow-cloud-web/browser/index.html

      - name: Validate Wrangler private full-stack config
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const expectedDirectory = './dist/noc-flow-cloud-web/browser';

          if (config.name !== 'p0-noc-flow-cloud-v2') {
            throw new Error('Unexpected Worker name');
          }
          if (config.main !== './cloudflare/worker.mjs') {
            throw new Error('Cloudflare API Worker entry-point is required');
          }
          if (config.workers_dev !== true) {
            throw new Error('workers_dev must stay enabled behind Access');
          }
          if (config.preview_urls !== false) {
            throw new Error('preview_urls must remain disabled');
          }
          if (config.assets?.directory !== expectedDirectory) {
            throw new Error('Unexpected assets.directory');
          }
          if (config.assets?.binding !== 'ASSETS') {
            throw new Error('ASSETS binding is required');
          }
          if (!Array.isArray(config.assets?.run_worker_first) ||
              !config.assets.run_worker_first.includes('/api/*')) {
            throw new Error('/api/* must run through the Worker before static assets');
          }
          if (config.assets?.not_found_handling !== 'single-page-application') {
            throw new Error('SPA fallback is required');
          }
          const d1 = config.d1_databases?.find((item) => item.binding === 'DB');
          if (!d1) {
            throw new Error('D1 DB binding is required');
          }
          if ('database_id' in d1) {
            throw new Error('D1 should stay auto-provisioned in source control');
          }
          NODE

      - name: Prepare non-provisioning Wrangler config for CI dry run
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases = config.d1_databases.map((item) =>
            item.binding === 'DB'
              ? {
                  ...item,
                  database_name: 'noc-flow-ci-dry-run',
                  database_id: '00000000-0000-0000-0000-000000000000',
                }
              : item,
          );
          fs.writeFileSync('wrangler.ci.jsonc', JSON.stringify(config, null, 2));
          NODE

      - name: Wrangler full-stack dry run
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.ci.jsonc
