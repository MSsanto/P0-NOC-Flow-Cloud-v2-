name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      frontend_ready: ${{ steps.frontend.outputs.ready }}
      compose_ready: ${{ steps.compose.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect frontend lockfile
        id: frontend
        run: |
          if [ -f apps/web/package-lock.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Detect Docker Compose stack
        id: compose
        run: |
          if [ -f compose.yaml ] && [ -f backend/Dockerfile ] && [ -f apps/web/Dockerfile ] && [ -f apps/web/nginx.conf ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nocflow
          POSTGRES_USER: nocflow
          POSTGRES_PASSWORD: nocflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U nocflow -d nocflow"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      NOCFLOW_ENVIRONMENT: test
      NOCFLOW_DATABASE_URL: postgresql+psycopg://nocflow:nocflow@localhost:5432/nocflow
      NOCFLOW_CORS_ORIGINS: '["http://localhost:4200"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Apply PostgreSQL migration
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: pytest
      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit
      - name: Start API and verify readiness
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/nocflow-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          python - <<'PY'
          import time, urllib.error, urllib.request
          url = "http://127.0.0.1:8000/api/v1/health/ready"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          print(response.read().decode()); break
              except (urllib.error.URLError, ConnectionError):
                  time.sleep(1)
          else:
              raise SystemExit("API readiness did not become healthy")
          PY

  frontend:
    needs: detect
    if: ${{ needs.detect.outputs.frontend_ready == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Upgrade npm
        run: npm install --global npm@11
      - name: Install frontend dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  compose-smoke:
    needs: [detect, backend, frontend]
    if: ${{ always() && needs.detect.outputs.compose_ready == 'true' && needs.backend.result == 'success' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for stack and functional smoke test
        run: |
          python - <<'PY'
          from datetime import UTC, datetime, timedelta
          import json, time, urllib.error, urllib.request

          def wait_ok(url: str) -> None:
              for _ in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          if response.status == 200:
                              print(url, "OK"); return
                  except (urllib.error.URLError, ConnectionError):
                      time.sleep(1)
              raise SystemExit(f"Smoke failed for {url}")

          def request_json(url: str, *, method: str = "GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, data=data, method=method, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=5) as response:
                  return response.status, json.loads(response.read().decode())

          wait_ok("http://127.0.0.1:8000/api/v1/health/ready")
          wait_ok("http://127.0.0.1:4200/")

          base = "http://127.0.0.1:4200/api/v1/incidents"
          payload = {
              "title": "Smoke WAN indisponível",
              "affected_resource": "WAN Loja Smoke",
              "severity": "HIGH",
              "impact_type": "OUTAGE",
              "symptoms": "Teste funcional do pipeline atravessando o stack completo.",
              "started_at": (datetime.now(UTC) - timedelta(minutes=1)).isoformat(),
          }
          status, created = request_json(base, method="POST", payload=payload)
          assert status == 201 and created["status"] == "OPEN"
          assert "tenant_id" not in created and "created_by_subject" not in created

          status, items = request_json(base)
          assert status == 200 and any(item["id"] == created["id"] for item in items)

          status, detail = request_json(f"{base}/{created['id']}")
          assert status == 200 and detail["id"] == created["id"]

          invalid = dict(payload, tenant_id="00000000-0000-4000-8000-000000000999")
          try:
              request_json(base, method="POST", payload=invalid)
          except urllib.error.HTTPError as error:
              assert error.code == 422
          else:
              raise AssertionError("Forged tenant_id should be rejected")

          print("Functional incident smoke OK", created["id"])
          PY
      - name: Show container status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
