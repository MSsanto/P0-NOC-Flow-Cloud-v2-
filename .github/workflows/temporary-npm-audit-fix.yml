name: Temporary npm audit remediation

on:
  push:
    branches:
      - feat/nocflow-brand-identity
    paths:
      - .github/workflows/temporary-npm-audit-fix.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/nocflow-brand-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Refresh compatible security patches
        run: npm audit fix --package-lock-only

      - name: Verify install and audit gate
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Commit remediated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh frontend security patches"
          git push origin HEAD:feat/nocflow-brand-identity
