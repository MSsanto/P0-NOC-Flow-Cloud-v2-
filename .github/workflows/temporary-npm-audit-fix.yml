name: Temporary npm audit remediation

on:
  push:
    branches:
      - feat/nocflow-brand-identity
    paths:
      - .github/workflows/temporary-npm-audit-fix.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/nocflow-brand-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Align Angular security patch line
        run: |
          npm pkg set             "dependencies.@angular/common=22.2.3"             "dependencies.@angular/core=22.2.3"             "dependencies.@angular/forms=22.2.3"             "dependencies.@angular/platform-browser=22.2.3"             "dependencies.@angular/router=22.2.3"             "devDependencies.@angular/build=22.2.3"             "devDependencies.@angular/cli=22.2.3"             "devDependencies.@angular/compiler-cli=22.2.3"
          rm -f package-lock.json
          npm install

      - name: Refresh compatible transitive patches
        run: npm audit fix --package-lock-only || true

      - name: Verify frontend and audit gate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Commit remediated dependencies
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: update Angular security patch line"
          git push origin HEAD:feat/nocflow-brand-identity
