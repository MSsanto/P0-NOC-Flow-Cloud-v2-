name: Persist Frontend Lockfile

on:
  pull_request:
    paths:
      - "apps/web/package.json"

permissions:
  contents: write

jobs:
  persist-lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Generate lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- apps/web/package-lock.json && git ls-files --error-unmatch apps/web/package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already tracked and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "build(web): version generated package lock"
          git push origin "HEAD:${HEAD_REF}"
